[package]
name = "brush-render"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
brush-cube.path = "../brush-cube"
brush-prefix-sum.path = "../brush-prefix-sum"
brush-sort.path = "../brush-sort"

# WebGPU everywhere. On macOS you can opt into native MSL with
# `brush-cube/metal` (see that crate's manifest for why it is not on by
# default). We still avoid Vulkan on Linux/Windows after the crashes in
# #423 / #395.
burn = { workspace = true, features = ["wgpu", "autodiff"] }
burn-wgpu.workspace = true
burn-cubecl.workspace = true
burn-fusion.workspace = true
burn-ir.workspace = true

glam.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
tracing.workspace = true
log.workspace = true
bytemuck.workspace = true

tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[features]
debug-validation = []
# Keep the fork's public feature name while routing compiler selection through
# the upstream opt-in switch at the lowest layer.
native-msl = ["brush-cube/metal"]
raster-census = ["dep:serde_json"]

# CubeCL emits WGSL by default on every platform. The native-msl feature opts
# the macOS Metal backend into CubeCL's MSL compiler; other backends still use
# WGSL.
[dev-dependencies]
assert_approx_eq.workspace = true
wasm-bindgen-test = "0.3"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]
